<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Verbario · Practica los tiempos verbales</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--fg:#14213d;--card:#fff;--mut:#5b6478;--ac:#0b6e99;--acf:#fff;--hl:#f2b134;--ok:#146c2e;--okb:#d8f3e0;--ko:#a4161a;--kob:#fde1e1;--bd:#cfd7e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a2c;--fg:#e8edf6;--card:#1a2740;--mut:#9aa7bf;--ac:#5cc0ea;--acf:#06202e;--hl:#f2b134;--ok:#7be0a0;--okb:#123524;--ko:#ff9a9d;--kob:#3d1a1d;--bd:#2c3b5a}}
:root[data-theme="dark"]{--bg:#101a2c;--fg:#e8edf6;--card:#1a2740;--mut:#9aa7bf;--ac:#5cc0ea;--acf:#06202e;--hl:#f2b134;--ok:#7be0a0;--okb:#123524;--ko:#ff9a9d;--kob:#3d1a1d;--bd:#2c3b5a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.big{font-family:Bitter,Georgia,serif}h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.3rem;margin:1.2em 0 .4em}
main{max-width:860px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}nav .sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 14px}
button:hover{border-color:var(--ac)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.go{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.lab{color:var(--mut);font-size:.9rem;margin-top:12px}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut)}.stats b{color:var(--fg)}
.big{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:700;text-align:center;margin:8px 0;border-bottom:4px solid var(--hl);display:inline-block;padding:0 6px}
.c{text-align:center}.fb{padding:12px;border-radius:8px;margin-top:12px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}
input[type=text]{width:100%;padding:12px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);font-size:1.3rem}
select{padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--card)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--bg)}
.mut{color:var(--mut)}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;padding:16px}.mode b{font-family:Bitter,Georgia,serif;font-size:1.15rem;display:block}
.fb table{background:var(--card);color:var(--fg);margin-top:8px}.fb td.r{color:var(--ok);font-weight:700}.fb td.w{color:var(--ko);font-weight:700}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),rnd=a=>a[Math.floor(Math.random()*a.length)],sp6=x=>x.split(' ');
const MODES={ind:'Indicativo',sub:'Subjuntivo',imv:'Imperativo'};
const NM={pres:'Presente',pcomp:'Pretérito perfecto compuesto',imp:'Pretérito imperfecto',plus:'Pretérito pluscuamperfecto',pret:'Pretérito perfecto simple',ant:'Pretérito anterior',fut:'Futuro simple',futc:'Futuro compuesto',cond:'Condicional simple',condc:'Condicional compuesto'};
const TK={ind:['pres','pcomp','imp','plus','pret','ant','fut','futc','cond','condc'],sub:['pres','pcomp','imp','plus','fut','futc'],imv:['pres']};
const EX={ind:{pres:'yo canto',pcomp:'yo he cantado',imp:'yo cantaba',plus:'yo había cantado',pret:'yo canté',ant:'yo hube cantado',fut:'yo cantaré',futc:'yo habré cantado',cond:'yo cantaría',condc:'yo habría cantado'},sub:{pres:'yo cante',pcomp:'yo haya cantado',imp:'yo cantara / cantase',plus:'yo hubiera / hubiese cantado',fut:'yo cantare',futc:'yo hubiere cantado'},imv:{pres:'¡canta! (tú)'}};
const PN=['yo','tú','él/ella/usted','nosotros/as','vosotros/as','ellos/ellas/ustedes'],PI=['tú','usted','nosotros','vosotros','ustedes'];
const PL=['1.ª persona singular (yo)','2.ª persona singular (tú)','3.ª persona singular (él/ella/usted)','1.ª persona plural (nosotros)','2.ª persona plural (vosotros)','3.ª persona plural (ellos/ustedes)'];
const NU=['Singular','Plural'],VZ=['Activa','Pasiva'];
/* persona (1-3) y número (0 sing, 1 plural) de cada índice de persona */
const IPN=[[2,0],[3,0],[1,1],[2,1],[3,1]];
const PNM=(m,p)=>m=='imv'?IPN[p]:[p%3+1,p>2?1:0];
const SUF={ar:{p:'o as a amos áis an',i:'aba abas aba ábamos abais aban',t:'é aste ó amos asteis aron',s:'e es e emos éis en'},er:{p:'o es e emos éis en',i:'ía ías ía íamos íais ían',t:'í iste ió imos isteis ieron',s:'a as a amos áis an'}};
SUF.ir={...SUF.er,p:'o es e imos ís en'};
const R=(s,t)=>s.split(' ').map(inf=>({inf,t}));
const D=[...R('cantar amar estudiar comprar llamar escuchar mirar cocinar ayudar esperar lavar dibujar buscar sacar pagar',1),...R('hablar trabajar caminar bailar viajar nadar llegar',0),...R('comer beber aprender vender temer romper vencer coger escoger',1),...R('correr',0),...R('escribir abrir partir recibir decidir dirigir',1),...R('vivir subir',0),
{inf:'pensar',t:1,c:['e','ie']},{inf:'contar',t:1,c:['o','ue']},{inf:'empezar',t:1,c:['e','ie']},{inf:'cerrar',t:1,c:['e','ie']},{inf:'encontrar',t:1,c:['o','ue']},{inf:'almorzar',c:['o','ue']},{inf:'jugar',c:['u','ue']},
{inf:'entender',t:1,c:['e','ie']},{inf:'perder',t:1,c:['e','ie']},{inf:'volver',c:['o','ue'],pp:'vuelto'},{inf:'mover',t:1,c:['o','ue']},{inf:'poder',c:['o','ue'],s:'pud',f:'podr'},{inf:'querer',t:1,c:['e','ie'],s:'quis',f:'querr'},
{inf:'sentir',t:1,c:['e','ie','i']},{inf:'dormir',c:['o','ue','u']},{inf:'morir',c:['o','ue','u'],pp:'muerto'},{inf:'pedir',t:1,c:['e','i','i']},{inf:'servir',t:1,c:['e','i','i']},{inf:'repetir',t:1,c:['e','i','i']},{inf:'seguir',t:1,c:['e','i','i']},{inf:'elegir',t:1,c:['e','i','i']},
{inf:'tener',t:1,c:['e','ie'],g:'teng',s:'tuv',f:'tendr',T:'ten'},{inf:'venir',c:['e','ie','i'],g:'veng',s:'vin',f:'vendr',T:'ven'},{inf:'decir',t:1,c:['e','i','i'],g:'dig',s:'dij',f:'dir',pp:'dicho',T:'di'},{inf:'hacer',t:1,g:'hag',s:'hic',f:'har',pp:'hecho',T:'haz'},{inf:'poner',t:1,g:'pong',s:'pus',f:'pondr',pp:'puesto',T:'pon'},{inf:'salir',g:'salg',f:'saldr',T:'sal'},
{inf:'traer',t:1,g:'traig',s:'traj'},{inf:'caer',g:'caig',v:1},{inf:'leer',t:1,v:1},{inf:'creer',t:1,v:1},{inf:'oír',t:1,P:'oigo oyes oye oímos oís oyen',v:1},{inf:'conocer',t:1,g:'conozc'},{inf:'ofrecer',t:1,g:'ofrezc'},{inf:'conducir',t:1,g:'conduzc',s:'conduj'},{inf:'andar',s:'anduv'},
{inf:'ver',t:1,P:'veo ves ve vemos veis ven',I:'veía veías veía veíamos veíais veían',R:'vi viste vio vimos visteis vieron',pp:'visto'},
{inf:'saber',t:1,P:'sé sabes sabe sabemos sabéis saben',S:'sepa sepas sepa sepamos sepáis sepan',s:'sup',f:'sabr'},
{inf:'construir',t:1,P:'construyo construyes construye construimos construís construyen',R:'construí construiste construyó construimos construisteis construyeron'},
{inf:'ser',P:'soy eres es somos sois son',I:'era eras era éramos erais eran',R:'fui fuiste fue fuimos fuisteis fueron',S:'sea seas sea seamos seáis sean',T:'sé',pp:'sido'},
{inf:'ir',P:'voy vas va vamos vais van',I:'iba ibas iba íbamos ibais iban',R:'fui fuiste fue fuimos fuisteis fueron',S:'vaya vayas vaya vayamos vayáis vayan',T:'ve',pp:'ido'},
{inf:'dar',t:1,P:'doy das da damos dais dan',R:'di diste dio dimos disteis dieron',S:'dé des dé demos deis den'},
{inf:'estar',P:'estoy estás está estamos estáis están',s:'estuv',S:'esté estés esté estemos estéis estén',T:'está'},
{inf:'haber',P:'he has ha hemos habéis han',S:'haya hayas haya hayamos hayáis hayan',s:'hub',f:'habr'}];
const V=n=>D.find(v=>v.inf==n),HV=V('haber'),SV=V('ser');
const isReg=v=>!['c','g','s','P','R','f','pp','S','T','I','v'].some(k=>k in v);
function sp(inf,st,e){const f=e[0];
 if(/car$/.test(inf)&&'eé'.includes(f))return st.replace(/c$/,'qu');
 if(/gar$/.test(inf)&&'eé'.includes(f))return st+'u';
 if(/zar$/.test(inf)&&'eé'.includes(f))return st.replace(/z$/,'c');
 if(/g[ei]r$/.test(inf)&&'oa'.includes(f))return st.replace(/g$/,'j');
 if(/guir$/.test(inf)&&'oa'.includes(f))return st.replace(/u$/,'');
 if(/[^aeiou]cer$/.test(inf)&&'oa'.includes(f))return st.replace(/c$/,'z');
 return st}
const cache={};
function tab(v){if(cache[v.inf])return cache[v.inf];
 const inf=v.inf,k=inf.slice(-2).replace('í','i'),st=inf.slice(0,-2),U=SUF[k],c=v.c;
 const rx=c&&new RegExp(c[0]+'(?=[^'+c[0]+']*$)'),lo=c?st.replace(rx,c[1]):st,lo2=c&&c[2]?st.replace(rx,c[2]):st;
 const ch=i=>c&&[0,1,2,5].includes(i)?lo:st;
 const pres=v.P?sp6(v.P):sp6(U.p).map((e,i)=>i==0&&v.g?v.g+e:sp(inf,ch(i),e)+e);
 const imp=v.I?sp6(v.I):sp6(U.i).map(e=>st+e);
 const pret=v.R?sp6(v.R):v.s?sp6('e iste o imos isteis ieron').map((e,i)=>{const s=v.s;if(i==2&&/c$/.test(s))return s.slice(0,-1)+'zo';if(i==5&&/j$/.test(s))e='eron';return s+e}):
  v.v?sp6('í íste yó ímos ísteis yeron').map(e=>st+e):sp6(U.t).map((e,i)=>sp(inf,c&&c[2]&&(i==2||i==5)?lo2:st,e)+e);
 const fb=v.f||inf.replace('í','i');
 const se=sp6(U.s);
 const spres=v.S?sp6(v.S):se.map((e,i)=>{const s=v.g?v.g:v.P?v.P.split(' ')[0].slice(0,-1):(c&&[0,1,2,5].includes(i)?lo:(c&&c[2]?lo2:st));return sp(inf,s,e)+e});
 const stem=pret[5].slice(0,-3),ac=stem.replace(/[aeiou](?=[^aeiou]*$)/,m=>'áéíóú'['aeiou'.indexOf(m)]);
 const sim=sp6('ra ras ra ramos rais ran').map((e,i)=>{const s=i==3?ac:stem;return s+e+'/'+s+sp6('se ses se semos seis sen')[i]});
 const sf=sp6('re res re remos reis ren').map((e,i)=>(i==3?ac:stem)+e);
 const r={ind:{pres,imp,pret,fut:sp6('é ás á emos éis án').map(e=>fb+e),cond:sp6('ía ías ía íamos íais ían').map(e=>fb+e)},sub:{pres:spres,imp:sim,fut:sf},imv:{pres:[v.T||pres[2],spres[2],spres[3],inf.slice(0,-1)+'d',spres[5]]}};
 r.pp=v.pp||st+(k=='ar'?'ado':(/[aeo]$/.test(st)?'ído':'ido'));
 return cache[inf]=r}
const AUX={'ind.pcomp':['ind','pres'],'ind.plus':['ind','imp'],'ind.ant':['ind','pret'],'ind.futc':['ind','fut'],'ind.condc':['ind','cond'],'sub.pcomp':['sub','pres'],'sub.plus':['sub','imp'],'sub.futc':['sub','fut']};
function conj(v,m,t,p,vo){const a=AUX[m+'.'+t],pp=tab(v).pp,pl=m=='imv'?p>1:p>2,part=pl?pp.replace(/o$/,'os'):pp;
 if(!vo)return a?tab(HV)[a[0]][a[1]][p]+' '+pp:tab(v)[m][t][p];
 return a?tab(HV)[a[0]][a[1]][p]+' sido '+part:tab(SV)[m][t][p]+' '+part}
const alts=s=>{const w=s.split(' ');return w[0].split('/').map(a=>[a,...w.slice(1)].join(' '))};
const flat=s=>s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[¡!¿?.,]/g,'').trim().replace(/\s+/g,' ');
const pron=/^(yo|tu|el|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes)\s+/;
const desc=q=>`${MODES[q.m]} · ${NM[q.t]} · voz ${q.vo?'pasiva':'activa'} · ${q.m=='imv'?PI[q.p]:PL[q.p]}`;

/* ---------- estado ---------- */
const TYPES=[['id','Identificar','Ves una forma verbal y marcas su modo y su tiempo.'],['wr','Escribir','Te damos verbo, modo, tiempo y persona. Tú escribes la forma.'],['an','Analizar (completo)','Ves una forma verbal y dices todo: infinitivo, persona, número, tiempo, modo y voz.'],['cj','Conjugar (completo)','Te damos infinitivo, persona, número, tiempo, modo y voz. Tú escribes la forma.']];
const isA=()=>G.type=='id'||G.type=='an',isW=()=>G.type=='wr'||G.type=='cj';
let G={type:'id',rounds:10,modes:'all',voz:'act',conj:'all',irr:'all'},best={};
try{best=JSON.parse(localStorage.getItem('verbario')||'{}')}catch(e){}
const app=$('#app');
const nav=t=>`<nav><h1 style="cursor:pointer" onclick="menu()">Verbario</h1><span class="sp"></span><button class="${t=='play'?'on':''}" onclick="menu()">Jugar</button><button class="${t=='study'?'on':''}" onclick="study()">Estudiar</button></nav>`;
const btns=(k,opts)=>`<div class="row">${opts.map(([v,l])=>`<button class="${G[k]==v?'on':''}" onclick="G.${k}=${JSON.stringify(v).replace(/"/g,"'")};menu()">${l}</button>`).join('')}</div>`;

function menu(){app.innerHTML=nav('play')+`<p class="mut">Practica los modos y tiempos verbales del español con cientos de conjugaciones distintas: regulares, irregulares, voz activa y pasiva.</p>
<div class="opts">${TYPES.map(([k,n,d])=>`<button class="mode ${G.type==k?'on':''}" onclick="G.type='${k}';menu()"><b>${n}</b>${d}</button>`).join('')}</div>
<div class="card"><div class="lab">Rondas</div>${btns('rounds',[5,10,20,30,50].map(n=>[n,n]))}
<div class="lab">Modos que aparecen</div>${btns('modes',[['all','Todos'],['ind','Indicativo'],['sub','Subjuntivo'],['imv','Imperativo']])}
<div class="lab">Voz</div>${btns('voz',[['act','Activa'],['pas','Pasiva'],['both','Ambas']])}
<div class="lab">Conjugación</div>${btns('conj',[['all','Todas'],['ar','1.ª (-ar)'],['er','2.ª (-er)'],['ir','3.ª (-ir)']])}
<div class="lab">Tipo de verbos</div>${btns('irr',[['all','Todos'],['reg','Regulares'],['irr','Irregulares']])}</div>
<button class="go" style="font-size:1.1rem;padding:12px 28px" onclick="start()">Empezar partida</button><p class="mut">${Object.keys(best).length?'Mejor puntuación — '+[['id','Identificar'],['wr','Escribir'],['an','Analizar'],['cj','Conjugar']].map(([k,l])=>l+': '+(best[k]||0)).join(' · '):''}</p>`}

function pool(){return D.filter(v=>(G.conj=='all'||v.inf.replace('í','i').endsWith(G.conj))&&(G.irr=='all'||(G.irr=='reg')==isReg(v))&&(G.voz!='pas'||v.t))}
function start(){G.i=0;G.score=0;G.streak=0;G.ok=0;G.bad=[];next()}
function next(){if(G.i>=G.rounds)return end();G.i++;const ms=G.modes=='all'?['ind','sub','imv','imv']:[G.modes];
 const all=[];ms.forEach(m=>TK[m].forEach(t=>all.push([m,t])));
 const [m,t]=rnd(all),v=rnd(pool()),vo=v.t&&(G.voz=='pas'||(G.voz=='both'&&Math.random()<.5))?1:0,p=Math.floor(Math.random()*(m=='imv'?5:6));
 const form=conj(v,m,t,p,vo);G.q={v,m,t,vo,p,form,shown:rnd(alts(form)),done:0,sel:{}};draw()}

function head(){return `<div class="stats"><span>Ronda <b>${G.i}/${G.rounds}</b></span><span>Puntos <b>${G.score}</b></span><span>Racha <b>${G.streak}</b></span><span style="margin-left:auto"><button onclick="menu()">Salir</button></span></div>`}
function draw(){const q=G.q;let h=nav('play')+head()+'<div class="card c">';
 if(G.type=='id'){h+=`<div class="mut">¿Qué modo y tiempo es?</div><div class="big">${q.shown}</div><div class="mut">infinitivo: ${q.v.inf}</div></div><div class="card"><div class="lab">Modo</div><div class="row">${Object.keys(MODES).map(m=>`<button class="${q.sel.m==m?'on':''}" ${q.done?'disabled':''} onclick="pick('m','${m}')">${MODES[m]}</button>`).join('')}</div>`;
  if(q.sel.m)h+=`<div class="lab">Tiempo</div><div class="row">${TK[q.sel.m].map(t=>`<button class="${q.sel.t==t?'on':''}" ${q.done?'disabled':''} onclick="pick('t','${t}')">${NM[t]}</button>`).join('')}</div>`;
  if(G.voz=='both')h+=`<div class="lab">Voz</div><div class="row">${[[0,'Activa'],[1,'Pasiva']].map(([n,l])=>`<button class="${q.sel.vo===n?'on':''}" ${q.done?'disabled':''} onclick="pick('vo',${n})">${l}</button>`).join('')}</div>`;
  h+=`<div class="row"><button class="go" id="chk" ${q.done||!ready()?'disabled':''} onclick="check()">Comprobar</button></div>`}
 else if(G.type=='an'){const d=q.done?'disabled':'',S=q.sel,B=(k,v,l)=>`<button class="${S[k]===v?'on':''}" ${d} onclick="pick('${k}',${v})">${l}</button>`;
  h+=`<div class="mut">Analiza esta forma verbal</div><div class="big">${q.shown}</div></div><div class="card"><div class="lab">Infinitivo</div><input type="text" id="inf" autocomplete="off" autocapitalize="off" spellcheck="false" ${d} value="${(q.inf||'').replace(/"/g,'&quot;')}" oninput="G.q.inf=this.value" placeholder="Ej.: cantar">
<div class="lab">Persona</div><div class="row">${[1,2,3].map(n=>B('pe',n,n+'.ª')).join('')}</div>
<div class="lab">Número</div><div class="row">${B('nu',0,'Singular')}${B('nu',1,'Plural')}</div>
<div class="lab">Modo</div><div class="row">${Object.keys(MODES).map(m=>`<button class="${S.m==m?'on':''}" ${d} onclick="pick('m','${m}')">${MODES[m]}</button>`).join('')}</div>`;
  if(S.m)h+=`<div class="lab">Tiempo</div><div class="row">${TK[S.m].map(t=>`<button class="${S.t==t?'on':''}" ${d} onclick="pick('t','${t}')">${NM[t]}</button>`).join('')}</div>`;
  h+=`<div class="lab">Voz</div><div class="row">${B('vo',0,'Activa')}${B('vo',1,'Pasiva')}</div><div class="row"><button class="go" ${d} onclick="check()">Comprobar</button></div>`}
 else if(G.type=='cj'){const [pe,nu]=PNM(q.m,q.p);
  h+=`<div class="mut">Conjuga este verbo</div><div class="big">${q.v.inf}</div><div class="tw"><table style="max-width:460px;margin:8px auto;text-align:left"><tr><th>Persona</th><td>${pe}.ª${q.m=='imv'?' ('+PI[q.p]+')':''}</td></tr><tr><th>Número</th><td>${NU[nu]}</td></tr><tr><th>Tiempo</th><td>${NM[q.t]}</td></tr><tr><th>Modo</th><td>${MODES[q.m]}</td></tr><tr><th>Voz</th><td>${VZ[q.vo]}${q.vo?' (ser + participio)':''}</td></tr></table></div></div><div class="card"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${q.done?'disabled':''} placeholder="Escribe aquí (¡con tilde!)"><div class="row"><button class="go" ${q.done?'disabled':''} onclick="check()">Comprobar</button></div>`}
 else h+=`<div class="mut">Escribe la forma verbal</div><div class="big">${q.v.inf}</div><p><b>${MODES[q.m]}</b> · ${NM[q.t]}<br>${q.m=='imv'?'Persona: '+PI[q.p]:PL[q.p]}<br>Voz ${q.vo?'pasiva':'activa'}${q.vo?' (ser + participio)':''}</p></div><div class="card"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${q.done?'disabled':''} placeholder="Escribe aquí (¡con tilde!)"><div class="row"><button class="go" ${q.done?'disabled':''} onclick="check()">Comprobar</button></div>`;
 h+=`<div id="fb"></div></div>`;app.innerHTML=h;
 const a=$('#ans')||$('#inf');if(a){if(!G.q.touched||a.id=='ans')a.focus();a.onkeydown=e=>{if(e.key=='Enter'&&!G.q.done)check()}}}
const ready=()=>{const s=G.q.sel;return s.m&&s.t&&(G.voz!='both'||s.vo!==undefined)};
function pick(k,val){const s=G.q.sel;s[k]=val;G.q.touched=1;if(k=='m'){s.t=TK[val].length==1?TK[val][0]:undefined}draw()}
function combos(q){const v=q.v,out=[];for(const m in TK)for(const t of TK[m])for(const vo of (v.t&&G.voz!='act'?[0,1]:[0]))for(let p=0;p<(m=='imv'?5:6);p++)if(alts(conj(v,m,t,p,vo)).includes(q.shown))out.push({m,t,vo,p});return out}
/* todos los análisis posibles de una forma (cualquier verbo, modo, tiempo, voz y persona) */
function allCombos(shown){const out=[];for(const v of D)for(const m in TK)for(const t of TK[m])for(const vo of (v.t?[0,1]:[0]))for(let p=0;p<(m=='imv'?5:6);p++)if(alts(conj(v,m,t,p,vo)).includes(shown))out.push({v,m,t,vo,p});return out}
function check(){const q=G.q;if(q.done)return;let good,accent=false,exp,body;
 if(G.type=='an'){const s=q.sel,inf=(q.inf||'').trim();
  if(!inf||!s.pe||s.nu===undefined||!s.m||!s.t||s.vo===undefined){$('#fb').innerHTML='<div class="fb ko">Completa todos los campos antes de comprobar (infinitivo, persona, número, modo, tiempo y voz).</div>';return}
  const cs=allCombos(q.shown),sc=c=>{const [pe,nu]=PNM(c.m,c.p);return[flat(inf)==flat(c.v.inf),pe==s.pe,nu==s.nu,c.m==s.m,c.t==s.t,c.vo==s.vo]};
  let bc=cs[0],bs=-1;cs.forEach(c=>{const n=sc(c).filter(Boolean).length;if(n>bs){bs=n;bc=c}});
  const r=sc(bc),[bpe,bnu]=PNM(bc.m,bc.p);good=bs==6;
  const rows=[['Infinitivo',inf,bc.v.inf],['Persona',s.pe+'.ª',bpe+'.ª'],['Número',NU[s.nu],NU[bnu]],['Modo',MODES[s.m],MODES[bc.m]],['Tiempo',NM[s.t],NM[bc.t]],['Voz',VZ[s.vo],VZ[bc.vo]]];
  exp=[...new Set(cs.map(c=>c.v.inf+' — '+desc(c)))].slice(0,4).join('<br>');
  body=`<div class="tw"><table><tr><th>Campo</th><th>Tu respuesta</th><th>Correcto</th></tr>${rows.map(([l,a,b],i)=>`<tr><td>${l}</td><td class="${r[i]?'r':'w'}">${r[i]?'✓':'✗'} ${a}</td><td>${b}</td></tr>`).join('')}</table></div>`+(good?'':`<br>Análisis posibles:<br>${exp}`)}
 else if(G.type=='id'){if(!ready())return;const cs=combos(q);good=cs.some(c=>c.m==q.sel.m&&c.t==q.sel.t&&(G.voz!='both'||c.vo===q.sel.vo));
  exp=cs.map(c=>desc({...c}));exp=[...new Set(exp)].slice(0,3).join('<br>');body='Es: '+exp}
 else{const raw=$('#ans').value;if(!raw.trim())return;const u=flat(raw).replace(pron,''),al=alts(q.form);good=al.some(a=>flat(a)==u);
  if(good)accent=!al.some(a=>a.toLowerCase()==raw.toLowerCase().replace(/[¡!]/g,'').trim().replace(pron,'').replace(/^(tú|él|ella)\s+/,''));exp=al.join(' / ');
  body='Respuesta: <b>'+exp+'</b><br><span class="mut">'+q.v.inf+' → '+desc(q)+'</span>'}
 q.done=1;if(good){G.ok++;G.streak++;G.score+=10+Math.min(G.streak-1,5)*2-(accent?5:0)}else{G.streak=0;G.bad.push({q,exp})}
 draw();$('#fb').innerHTML=`<div class="fb ${good?'ok':'ko'}"><b>${good?(accent?'¡Casi! Revisa las tildes.':'¡Correcto!'):'No era esa.'}</b><br>${body}</div><div class="row"><button class="go" id="nx" onclick="next()">${G.i>=G.rounds?'Ver resultado':'Siguiente'}</button></div>`;$('#nx').focus()}
function end(){const k=G.type,pct=Math.round(G.ok/G.rounds*100);let nr=0;if((best[k]||0)<G.score){best[k]=G.score;nr=1;try{localStorage.setItem('verbario',JSON.stringify(best))}catch(e){}}
 app.innerHTML=nav('play')+`<div class="card c"><h2>Partida terminada</h2><div class="big">${G.score} puntos</div><p>${G.ok} de ${G.rounds} aciertos (${pct}%)${nr?' · ¡nuevo récord!':''}</p><div class="row" style="justify-content:center"><button class="go" onclick="start()">Jugar otra vez</button><button onclick="menu()">Cambiar ajustes</button></div></div>`+(G.bad.length?`<h2>Para repasar</h2><div class="card tw"><table><tr><th>Forma / verbo</th><th>Solución</th></tr>${G.bad.map(b=>`<tr><td><b>${isA()?b.q.shown:b.q.v.inf}</b></td><td>${isA()?b.exp:desc(b.q)+'<br><b>'+b.q.form+'</b>'}</td></tr>`).join('')}</table></div>`:'<p class="c">¡Sin errores!</p>')}

/* ---------- estudio ---------- */
let S={v:'cantar',vo:0};
function study(){const v=V(S.v),vo=v.t?S.vo:0;let h=nav('study')+`<div class="card"><h2 style="margin-top:0">Los tiempos verbales</h2><p class="mut">Ejemplos con «cantar». La voz pasiva se forma con el verbo <i>ser</i> + participio (yo soy amado, yo he sido amado).</p>`;
 for(const m in TK)h+=`<h3>${MODES[m]}</h3><div class="tw"><table>${TK[m].map(t=>`<tr><th>${NM[t]}</th><td>${EX[m][t]}</td></tr>`).join('')}</table></div>`;
 h+=`</div><div class="card"><h2 style="margin-top:0">Conjuga cualquier verbo</h2><div class="row"><select id="sv" onchange="S.v=this.value;study()">${[...D].sort((a,b)=>a.inf.localeCompare(b.inf,'es')).map(x=>`<option ${x.inf==S.v?'selected':''}>${x.inf}</option>`).join('')}</select>${v.t?`<button class="${!vo?'on':''}" onclick="S.vo=0;study()">Voz activa</button><button class="${vo?'on':''}" onclick="S.vo=1;study()">Voz pasiva</button>`:'<span class="mut">Verbo intransitivo: sin voz pasiva</span>'}</div><p class="mut">Participio: <b>${tab(v).pp}</b> · ${isReg(v)?'verbo regular':'verbo con irregularidades'}</p>`;
 for(const m of ['ind','sub'])h+=`<h3>${MODES[m]}</h3><div class="tw"><table><tr><th></th>${PN.map(p=>`<th>${p}</th>`).join('')}</tr>${TK[m].map(t=>`<tr><th>${NM[t]}</th>${PN.map((_,p)=>`<td>${conj(v,m,t,p,vo).replace(/\//g,' / ')}</td>`).join('')}</tr>`).join('')}</table></div>`;
 h+=`<h3>Imperativo</h3><div class="tw"><table><tr>${PI.map(p=>`<th>${p}</th>`).join('')}</tr><tr>${PI.map((_,p)=>`<td>¡${conj(v,'imv','pres',p,vo)}!</td>`).join('')}</tr></table></div></div>`;
 app.innerHTML=h}
menu();
</script></body></html>
